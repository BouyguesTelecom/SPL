# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: SPL Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `npm publish --provenance`: it is what grants access to the OIDC token npm
      # signs the attestation with. It is never granted by default and has to be asked for.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Update package version from tag
        run: npm version ${GITHUB_REF#refs/tags/} --no-git-tag-version
      - name: Install dependencies
        run: npm i
      # `--provenance` attaches a signed attestation tying the published tarball to this commit and workflow
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPMJS_TOKEN}}
